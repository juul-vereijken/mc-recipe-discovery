[[mods]]
    modId="mc_recipe_discovery"
    version="1.0.0"
    displayName="Recipe Discovery"
    logoFile="logo.png"
    description='''
A Minecraft 1.21 mod that locks all crafting recipes behind Knowledge Books
hidden in structure chests. Find them to learn them.

Works with Dungeons and Taverns and any other mod that adds loot tables —
no load order required.
'''

